name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Check lock file
        run: |
          nix flake lock
          git diff --exit-code -- flake.lock
      - name: Test
        run: nix develop --command python -m unittest discover -s tests
      - name: Exercise GUI dialogs
        run: nix develop --command bash -c 'dbus-run-session --config-file="$DBUS_SESSION_CONFIG" -- xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo TENKR_GUI_TEST=1 python -m unittest discover -s tests -p test_gui.py -v'
      - name: Build
        run: nix flake check --no-update-lock-file
